<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Đường Đi Ngắn Nhất</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
        }
        .form-control:focus {
            border-color: #4d90fe;
            box-shadow: 0 0 0 0.25rem rgba(77, 144, 254, 0.25);
        }
        .btn-primary {
            background-color: #4285f4;
            border-color: #4285f4;
        }
        .btn-primary:hover {
            background-color: #357ae8;
            border-color: #357ae8;
        }
        .route-info {
            background-color: #fff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .route-info h4 {
            color: #4285f4;
            margin-bottom: 15px;
        }
        .info-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .loader {
            display: none;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #4285f4;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Tìm Đường Đi Ngắn Nhất</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4">
                    <h3 class="mb-4">Nhập Địa Chỉ</h3>
                    <form id="route-form">
                        <div class="mb-3">
                            <label for="from-address" class="form-label">Địa Điểm Xuất Phát:</label>
                            <input type="text" class="form-control" id="from-address" placeholder="Nhập địa chỉ xuất phát" required>
                        </div>
                        <div class="mb-3">
                            <label for="to-address" class="form-label">Địa Điểm Đến:</label>
                            <input type="text" class="form-control" id="to-address" placeholder="Nhập địa chỉ đến" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Tìm Đường</button>
                    </form>
                    
                    <div class="loader" id="loader"></div>
                    
                    <div class="route-info" id="route-info" style="display: none;">
                        <h4>Thông Tin Tuyến Đường</h4>
                        <div class="info-item">
                            <strong>Khoảng Cách:</strong> <span id="distance">0</span> km
                        </div>
                        <div class="info-item">
                            <strong>Thời Gian Di Chuyển:</strong> <span id="duration">0</span> phút
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card p-0">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@mapbox/polyline@1.1.1/src/polyline.js"></script>
    <script src="script.js"></script>
</body>
</html>
